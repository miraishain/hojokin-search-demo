<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>補助金・助成金検索 デモ｜ミライシャイン</title>
  <meta name="description" content="ミライシャインの補助金検索サービスのデモ。地域・用途・キーワードから補助金・助成金を検索できます（公開オープンデータのスナップショット）。" />
  <!-- デモ環境のため検索エンジンには載せない -->
  <meta name="robots" content="noindex, nofollow" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/style.css" />
</head>
<body>
  <!-- Header -->
  <header class="site-header">
    <div class="container header-inner">
      <a href="./" class="logo">
        <span class="logo-mark">M</span>
        <span class="logo-text">ミライシャイン</span>
      </a>
      <span class="header-tag">補助金検索サービス デモ</span>
    </div>
  </header>

  <main>
    <!-- Hero + 検索 -->
    <section class="hero">
      <div class="container">
        <div class="hero-card">
          <div class="hero-inner">
            <h1 class="hero-title">補助金・助成金をさがす</h1>
            <p class="hero-lead">地域・用途・キーワードから、いま公募中の補助金・助成金を検索できます。</p>
            <form class="search-form" id="searchForm" autocomplete="off">
              <input type="text" id="kw" class="f-input" placeholder="キーワード（例：IT、設備、創業）" aria-label="キーワード" />
              <select id="area" class="f-select" aria-label="地域"><option value="">すべての地域</option></select>
              <select id="purpose" class="f-select" aria-label="用途"><option value="">すべての用途</option></select>
              <button type="submit" class="f-btn">検索</button>
            </form>
          </div>
        </div>
      </div>
    </section>

    <!-- 結果 -->
    <section class="results">
      <div class="container">
        <div class="result-bar">
          <p class="result-count" id="resultCount">読み込み中…</p>
          <label class="sort">
            <span>並び替え</span>
            <select id="sort" class="f-select">
              <option value="deadline">締切が近い順</option>
              <option value="amount">上限金額が大きい順</option>
            </select>
          </label>
        </div>
        <ul class="card-list" id="cardList" aria-live="polite"></ul>
        <div class="empty" id="empty" hidden>該当する補助金・助成金は見つかりませんでした。条件を変えてお試しください。</div>
        <div class="more-wrap">
          <button class="more-btn" id="moreBtn" hidden>もっと見る</button>
        </div>
      </div>
    </section>
  </main>

  <!-- Footer：出典・免責 -->
  <footer class="site-footer">
    <div class="container">
      <p class="foot-credit">
        出典：<a href="https://www.jgrants-portal.go.jp/" target="_blank" rel="noopener">Jグランツ（デジタル庁）</a>
        ／ <a href="https://mirasapo-plus.go.jp/" target="_blank" rel="noopener">ミラサポplus（中小企業庁）</a>
      </p>
      <p class="foot-note" id="footNote">
        ※本ページはデモです。掲載情報は取得時点のスナップショットであり、最新・正確な内容は各補助金の公式ページでご確認ください。
      </p>
      <p class="foot-copy">© <span id="year"></span> Miraishine</p>
    </div>
  </footer>

  <script src="assets/app.js"></script>
</body>
</html>
